<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova AI</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;background:#212121;color:#eee;font:15px Arial;display:flex}#side{width:250px;background:#171717;padding:12px}button{cursor:pointer}#new{width:100%;padding:11px;background:none;color:white;border:1px solid #444;border-radius:9px}.chat{padding:10px;border-radius:8px}.chat:hover,.active{background:#2d2d2d}.label{color:#999;font-size:12px;margin:18px 8px 7px}#main{flex:1;display:flex;flex-direction:column}header{height:58px;border-bottom:1px solid #333;padding:18px;font-weight:bold;font-size:20px}.sub{font-size:12px;color:#999;margin-left:8px}#messages{flex:1;overflow:auto;padding:25px 15px 120px}.msg{max-width:820px;margin:0 auto 22px;display:flex;gap:14px;line-height:1.55}.avatar{width:32px;height:32px;border-radius:8px;background:#3b3b3b;display:grid;place-items:center;flex:none}.user .avatar{background:#555}.content{white-space:pre-wrap;overflow-wrap:anywhere}#composer{position:fixed;bottom:0;left:250px;right:0;padding:15px;background:linear-gradient(transparent,#212121 30%)}form{max-width:820px;margin:auto;background:#303030;border:1px solid #4a4a4a;border-radius:16px;padding:8px;display:flex}textarea{flex:1;background:none;border:0;outline:0;color:white;resize:none;padding:10px}#send{width:44px;border:0;border-radius:10px;background:#19c37d;color:white}@media(max-width:700px){#side{display:none}#composer{left:0}}</style></head><body>
<aside id="side"><button id="new">＋ New chat</button><div class="label">CONVERSATIONS</div><div id="list"></div></aside><main id="main"><header>✨ Nova <span class="sub">Claude-powered</span></header><div id="messages"></div><div id="composer"><form id="form"><textarea id="input" rows="1" placeholder="Message Nova..."></textarea><button id="send">↑</button></form></div></main>
<script>
const $=x=>document.getElementById(x);let chats=JSON.parse(localStorage.getItem("nova_chats")||"[]"),current=chats.length-1;
function save(){localStorage.setItem("nova_chats",JSON.stringify(chats))}function list(){$("list").innerHTML="";chats.forEach((c,i)=>{let d=document.createElement("div");d.className="chat "+(i===current?"active":"");d.textContent=c.title||"New chat";d.onclick=()=>{current=i;render();list()};$("list").appendChild(d)})}
function add(text,role="assistant"){let r=document.createElement("div"),a=document.createElement("div"),c=document.createElement("div");r.className="msg "+(role==="user"?"user":"");a.className="avatar";a.textContent=role==="user"?"Y":"N";c.className="content";c.textContent=text;r.append(a,c);$("messages").appendChild(r);$("messages").scrollTop=$("messages").scrollHeight;return c}
function render(){$("messages").innerHTML="";if(current<0){add("Hi! I'm Nova. How can I help?");return}chats[current].messages.forEach(m=>add(m.content,m.role))}
$("new").onclick=()=>{chats.push({title:"New chat",messages:[]});current=chats.length-1;save();list();render()};
$("form").onsubmit=async e=>{e.preventDefault();let text=$("input").value.trim();if(!text)return;if(current<0)$("new").click();let c=chats[current];if(!c.messages.length)c.title=text.slice(0,40);c.messages.push({role:"user",content:text});save();list();add(text,"user");$("input").value="";$("send").disabled=true;let target=add("Thinking...");try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:c.messages})});let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");target.textContent=d.reply;c.messages.push({role:"assistant",content:d.reply});save()}catch(err){target.textContent="Nova error: "+err.message}finally{$("send").disabled=false}};
$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}};list();render();
</script></body></html>
