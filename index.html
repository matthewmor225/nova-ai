<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;background:#212121;color:#eee;font:15px Arial;display:flex}
button{cursor:pointer}
#side{width:250px;background:#171717;padding:12px}
#new{width:100%;padding:11px;background:none;color:white;border:1px solid #444;border-radius:9px}
.chat{padding:10px;border-radius:8px;cursor:pointer}
.chat:hover,.active{background:#2d2d2d}
.label{color:#999;font-size:12px;margin:18px 8px 7px}
#main{flex:1;display:flex;flex-direction:column}
header{height:58px;border-bottom:1px solid #333;padding:18px;font-weight:bold;font-size:20px}
.sub{font-size:12px;color:#999;margin-left:8px}
#messages{flex:1;overflow:auto;padding:25px 15px 120px}
.msg{max-width:820px;margin:0 auto 22px;display:flex;gap:14px;line-height:1.55}
.avatar{width:32px;height:32px;border-radius:8px;background:#3b3b3b;display:grid;place-items:center;flex:none}
.user .avatar{background:#555}
.content{white-space:pre-wrap;overflow-wrap:anywhere}
#composer{position:fixed;bottom:0;left:250px;right:0;padding:15px;background:linear-gradient(transparent,#212121 30%)}
form{max-width:820px;margin:auto;background:#303030;border:1px solid #4a4a4a;border-radius:16px;padding:8px;display:flex}
textarea{flex:1;background:none;border:0;outline:0;color:white;resize:none;padding:10px}
#send{width:44px;border:0;border-radius:10px;background:#19c37d;color:white}
#send:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:700px){#side{display:none}#composer{left:0}}
</style>
</head>
<body>
<aside id="side">
  <button id="new">＋ New chat</button>
  <div class="label">CONVERSATIONS</div>
  <div id="list"></div>
</aside>

<main id="main">
  <header>✨ Nova <span class="sub">Claude-powered</span></header>
  <div id="messages"></div>
  <div id="composer">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Message Nova..."></textarea>
      <button id="send" type="submit">↑</button>
    </form>
  </div>
</main>

<script>
const API_URL = "https://novaai-zeta-green.vercel.app/api/chat";

const $ = id => document.getElementById(id);

let chats = JSON.parse(localStorage.getItem("nova_chats") || "[]");
let current = chats.length - 1;

function save() {
  localStorage.setItem("nova_chats", JSON.stringify(chats));
}

function list() {
  $("list").innerHTML = "";

  chats.forEach((chat, index) => {
    const item = document.createElement("div");
    item.className = "chat " + (index === current ? "active" : "");
    item.textContent = chat.title || "New chat";

    item.onclick = () => {
      current = index;
      render();
      list();
    };

    $("list").appendChild(item);
  });
}

function addMessage(text, role = "assistant") {
  const row = document.createElement("div");
  const avatar = document.createElement("div");
  const content = document.createElement("div");

  row.className = "msg " + (role === "user" ? "user" : "");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "Y" : "N";
  content.className = "content";
  content.textContent = text;

  row.append(avatar, content);
  $("messages").appendChild(row);
  $("messages").scrollTop = $("messages").scrollHeight;

  return content;
}

function render() {
  $("messages").innerHTML = "";

  if (current < 0) {
    addMessage("Hi! I'm Nova. How can I help?");
    return;
  }

  chats[current].messages.forEach(message => {
    addMessage(message.content, message.role);
  });
}

$("new").onclick = () => {
  chats.push({
    title: "New chat",
    messages: []
  });

  current = chats.length - 1;
  save();
  list();
  render();
};

$("form").onsubmit = async event => {
  event.preventDefault();

  const text = $("input").value.trim();
  if (!text) return;

  if (current < 0) {
    chats.push({
      title: "New chat",
      messages: []
    });
    current = chats.length - 1;
  }

  const chat = chats[current];

  if (!chat.messages.length) {
    chat.title = text.slice(0, 40);
  }

  chat.messages.push({
    role: "user",
    content: text
  });

  save();
  list();
  addMessage(text, "user");

  $("input").value = "";
  $("send").disabled = true;

  const thinking = addMessage("Thinking...");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: chat.messages
      })
    });

    const raw = await response.text();

    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        "Nova's server returned invalid data (HTTP " +
        response.status +
        ")."
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error || "Nova request failed (HTTP " + response.status + ")."
      );
    }

    const reply = data.reply || "Nova returned no response.";

    thinking.textContent = reply;

    chat.messages.push({
      role: "assistant",
      content: reply
    });

    save();

  } catch (error) {
    thinking.textContent = "Nova error: " + error.message;
  } finally {
    $("send").disabled = false;
    $("input").focus();
  }
};

$("input").onkeydown = event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("form").requestSubmit();
  }
};

list();
render();
</script>
</body>
</html>
